[package]
name = "pybindungen"
description = "Python-Modul „kimi3_kern“: macht die Rust-Logik in Python nutzbar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "kimi3_kern"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
kern.workspace = true
serde.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }
