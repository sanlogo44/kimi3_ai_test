# Cargo-Arbeitsbereich: alle Rust-Teile des Projekts.
#
#   kern         – Logik und Datenhaltung (eine Bibliothek, keine Oberfläche)
#   web          – Weboberfläche (axum) samt Seitenvorlagen
#   pybindungen  – Python-Modul „kimi3_kern“ auf Basis von PyO3
[workspace]
resolver = "2"
members = ["kern", "web", "pybindungen"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
kern = { path = "kern" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
scrypt = { version = "0.11", default-features = false, features = ["simple"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.8"
hex = "0.4"

[profile.release]
opt-level = 2
strip = true
